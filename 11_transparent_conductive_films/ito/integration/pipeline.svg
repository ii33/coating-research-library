<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" fill="#f3f7fb"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#19344a}.h{font-size:22px;font-weight:bold}.b{font-size:17px}.box{fill:white;stroke:#477991;stroke-width:2}</style><text x="32" y="37" class="h">ITO 研究链  各模块分别测量与校准</text><g><rect class="box" x="25" y="65" width="210" height="125" rx="10"/><text class="h" x="45" y="100">源与气相</text><text class="b" x="45" y="133">组成  温度  源寿命</text><text class="b" x="45" y="164">蒸气物种与角分布</text><rect class="box" x="275" y="65" width="210" height="125" rx="10"/><text class="h" x="295" y="100">工件暴露</text><text class="b" x="295" y="133">入射元素通量</text><text class="b" x="295" y="164">氧化  离子  温度历史</text><rect class="box" x="525" y="65" width="290" height="125" rx="10"/><text class="h" x="545" y="100">材料状态</text><text class="b" x="545" y="133">库存  厚度  密度  微结构</text><text class="b" x="545" y="164">N  μdc  μopt  ε(λ)</text><rect class="box" x="855" y="65" width="315" height="125" rx="10"/><text class="h" x="875" y="100">测量算子与目标</text><text class="b" x="875" y="133">Rs  Hall  T/R  椭偏  散射</text><text class="b" x="875" y="164">基片  接触  光谱与几何</text></g><g stroke="#477991" stroke-width="3" fill="none"><path d="M235 125H270m-10-6 10 6-10 6"/><path d="M485 125H520m-10-6 10 6-10 6"/><path d="M815 125H850m-10-6 10 6-10 6"/></g><text class="b" x="32" y="231">到达量 ≠ 净留存量；源配比 ≠ 膜成分；单个方阻不能唯一确定 N 和 μ</text><text class="b" x="32" y="269">原创概念图  ·  实际输入未测时保持 unknown  ·  本轮没有产品运行时或机台集成</text></svg>
